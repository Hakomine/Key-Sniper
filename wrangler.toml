# Einspielen mit:  npx wrangler deploy   (aus DIESEM Ordner)
#
# ACHTUNG: Alles, was hier NICHT steht, wirft ein Deploy weg – KV-Bindung,
# Variablen und Cron-Trigger. Deshalb steht unten alles vollständig drin.
# Nur Secrets sind getrennt gespeichert und überleben ein Deploy.
#
# Aus dem Home-Verzeichnis heraus scheitert wrangler an der gesperrten
# Windows-Verknüpfung C:\Users\<name>\Anwendungsdaten – immer aus dem
# Projektordner starten.

name = "key-sniper"
main = "worker.js"
compatibility_date = "2024-11-01"

# Genre-Datenbank, die der GitHub-Job stündlich aktualisiert
[vars]
GENRES_URL = "https://raw.githubusercontent.com/Hakomine/Key-Sniper/main/genres-db.json"

# Merkt sich gemeldete Deals, damit derselbe nicht alle 10 Minuten pingt
[[kv_namespaces]]
binding = "SNIPER_KV"
id = "e777aa6077fb4fe6b4f9f138d1137937"

[triggers]
crons = ["*/10 * * * *"]

# Secrets separat setzen (überleben Deploys, stehen nie in dieser Datei):
#   npx wrangler secret put ITAD_API_KEY
#   npx wrangler secret put GGDEALS_API_KEY
#   npx wrangler secret put DISCORD_WEBHOOK
