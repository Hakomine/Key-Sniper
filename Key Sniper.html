<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Key Sniper</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2330; --border: #2a3040;
    --text: #e7ebf2; --muted: #8b93a7; --accent: #4ade80; --accent2: #38bdf8;
    --gold: #fbbf24; --danger: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb; --panel: #ffffff; --panel2: #f0f3f9; --border: #dde3ee;
      --text: #1a2233; --muted: #5b6474; --accent: #16a34a; --accent2: #0284c7;
      --gold: #d97706; --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4; }
  header { padding: 22px 24px 14px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.3px; }
  h1 .em { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 16px; padding: 18px; margin: 18px 0; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; }
  .ctrl label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .ctrl .val { color: var(--accent); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=search] { width: 100%; padding: 9px 11px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 9px; color: var(--text); font-size: 14px; }
  select { width: 100%; padding: 9px 11px; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); font-size: 14px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; user-select: none; margin-top: 22px; }
  .toggle input { width: 17px; height: 17px; accent-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; padding-bottom: 60px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; display: flex; gap: 13px; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .box { width: 74px; height: 98px; flex: 0 0 auto; border-radius: 8px; object-fit: cover;
    background: var(--panel2); border: 1px solid var(--border); }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 650; font-size: 15px; margin: 0 0 6px; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { color: var(--accent2); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--panel2);
    border: 1px solid var(--border); color: var(--muted); }
  .badge.low { color: var(--gold); border-color: var(--gold); }
  .badge.gap { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .badge.steam { color: var(--accent2); border-color: var(--accent2); }
  .prices { font-size: 13px; color: var(--muted); }
  .prices b { color: var(--text); }
  .price-main { font-size: 20px; font-weight: 700; color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; gap: 8px; }
  .buy { display: inline-block; margin-top: 10px; padding: 7px 13px; border-radius: 9px;
    background: var(--accent); color: #04120a; font-weight: 650; font-size: 13px; text-decoration: none; }
  .buy:hover { filter: brightness(1.08); }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty code { background: var(--panel2); padding: 2px 7px; border-radius: 6px; color: var(--accent2); }
  a.link { color: var(--accent2); }
</style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;width:100%;padding:0;">
      <h1>🎯 Key <span class="em">Sniper</span></h1>
      <span class="meta" id="meta"></span>
    </div>
  </header>

  <div class="wrap">
    <div class="controls" id="controls">
      <div class="ctrl">
        <label>Mindest-Lücke: <span class="val" id="gapAbsVal">5 €</span></label>
        <input type="range" id="gapAbs" min="0" max="30" step="0.5" value="5" />
      </div>
      <div class="ctrl">
        <label>Mindest-Lücke: <span class="val" id="gapPctVal">0 %</span></label>
        <input type="range" id="gapPct" min="0" max="90" step="5" value="0" />
      </div>
      <div class="ctrl">
        <label>Max. Preis: <span class="val" id="maxPriceVal">egal</span></label>
        <input type="range" id="maxPrice" min="0" max="70" step="1" value="0" />
      </div>
      <div class="ctrl">
        <label>Sortierung</label>
        <select id="sort">
          <option value="gapAbs">Größte Lücke (€)</option>
          <option value="gapPct">Größte Lücke (%)</option>
          <option value="pop">Beliebtheit</option>
          <option value="price">Billigster Preis</option>
          <option value="title">Name (A–Z)</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Suche</label>
        <input type="search" id="q" placeholder="Spielname ..." />
      </div>
      <div class="ctrl">
        <label class="toggle"><input type="checkbox" id="onlyRep" /> Nur seriöse Stores</label>
        <label class="toggle" style="margin-top:10px"><input type="checkbox" id="onlyLow" /> Nur Historical Low</label>
        <label class="toggle" style="margin-top:10px"><input type="checkbox" id="onlySteam" /> Nur Steam-Keys</label>
      </div>
    </div>

    <p class="summary" id="summary"></p>
    <div class="grid" id="grid"></div>
  </div>

<script src="deals.js"></script>
<script>
  const D = window.SNIPER_DATA || { deals: [] };
  const $ = (id) => document.getElementById(id);
  const eur = (n) => (n == null ? "–" : n.toLocaleString("de-DE", { style: "currency", currency: D.deals?.[0]?.currency || "EUR" }));

  // Meta-Zeile
  if (D.generatedAt) {
    const d = new Date(D.generatedAt);
    $("meta").textContent = `Stand: ${d.toLocaleString("de-DE")} · ${D.count} Kandidaten · Land ${D.country}`;
  } else {
    $("meta").textContent = "Noch keine Daten gesammelt";
  }

  const ui = {
    gapAbs: $("gapAbs"), gapPct: $("gapPct"), maxPrice: $("maxPrice"),
    sort: $("sort"), q: $("q"), onlyRep: $("onlyRep"), onlyLow: $("onlyLow"), onlySteam: $("onlySteam"),
  };

  function render() {
    const gapAbs = parseFloat(ui.gapAbs.value);
    const gapPct = parseInt(ui.gapPct.value, 10);
    const maxPrice = parseInt(ui.maxPrice.value, 10);
    const q = ui.q.value.trim().toLowerCase();
    const onlyRep = ui.onlyRep.checked;
    const onlyLow = ui.onlyLow.checked;
    const onlySteam = ui.onlySteam.checked;

    $("gapAbsVal").textContent = gapAbs + " €";
    $("gapPctVal").textContent = gapPct + " %";
    $("maxPriceVal").textContent = maxPrice === 0 ? "egal" : maxPrice + " €";

    const grid = $("grid");
    if (!D.deals || D.deals.length === 0) {
      grid.innerHTML = "";
      $("summary").textContent = "";
      grid.insertAdjacentHTML("beforeend",
        `<div class="empty" style="grid-column:1/-1">
          <p style="font-size:16px">Noch keine Deals gesammelt.</p>
          <p>Trag deinen ITAD-Key in <code>key.txt</code> ein und starte <code>run.bat</code>
          (oder <code>node collector.mjs</code>).</p>
          <p>Key gibt's kostenlos auf <a class="link" href="https://isthereanydeal.com/apps/" target="_blank" rel="noopener">isthereanydeal.com/apps</a></p>
        </div>`);
      return;
    }

    // aktive Sicht je nach Häkchen: nur seriöse Stores oder alle
    let items = [];
    for (const r of D.deals) {
      const v = onlyRep ? r.rep : r.all;
      if (!v) continue;
      items.push({ r, v });
    }
    items = items.filter(({ r, v }) => {
      if (v.gapAbs < gapAbs) return false;
      if (v.gapPct < gapPct) return false;
      if (maxPrice > 0 && v.cheapest.price > maxPrice) return false;
      if (onlyLow && !v.atHistLow) return false;
      if (onlySteam && !v.cheapest.steam) return false;
      if (q && !r.title.toLowerCase().includes(q)) return false;
      return true;
    });

    const s = ui.sort.value;
    items.sort((a, b) => {
      if (s === "gapAbs") return b.v.gapAbs - a.v.gapAbs;
      if (s === "gapPct") return b.v.gapPct - a.v.gapPct;
      if (s === "pop") return (b.r.pop || 0) - (a.r.pop || 0) || (b.v.gapAbs - a.v.gapAbs);
      if (s === "price") return a.v.cheapest.price - b.v.cheapest.price;
      if (s === "title") return a.r.title.localeCompare(b.r.title);
      return 0;
    });

    $("summary").textContent = `${items.length} von ${D.deals.length} Deals passen zu deinen Filtern${onlyRep ? " (nur seriöse Stores)" : ""}`;
    grid.innerHTML = items.map(({ r, v }) => {
      const box = r.boxart
        ? `<img class="box" src="${r.boxart}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="box"></div>`;
      const lowBadge = v.atHistLow ? `<span class="badge low">📉 Historical Low</span>` : "";
      const steamBadge = v.cheapest.steam ? `<span class="badge steam">Steam</span>` : "";
      const cutBadge = v.cheapest.cut ? `<span class="badge">−${v.cheapest.cut}%</span>` : "";
      return `<div class="card">
        ${box}
        <div class="body">
          <p class="title"><a href="${r.itadUrl}" target="_blank" rel="noopener">${r.title}</a></p>
          <div class="badges">
            <span class="badge gap">${v.gapAbs} € / ${v.gapPct}% Lücke</span>
            ${lowBadge}${steamBadge}${cutBadge}
          </div>
          <div class="row">
            <span class="price-main">${eur(v.cheapest.price)}</span>
            <span class="prices">bei <b>${v.cheapest.shop}</b></span>
          </div>
          <div class="prices">Zweitbilligster: ${eur(v.second.price)} bei ${v.second.shop}
            ${r.histLow != null ? ` · ATL ${eur(r.histLow)}` : ""}</div>
          <a class="buy" href="${v.cheapest.url}" target="_blank" rel="noopener">Zum Shop →</a>
        </div>
      </div>`;
    }).join("");
  }

  Object.values(ui).forEach((el) => {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });
  render();
</script>
</body>
</html>
