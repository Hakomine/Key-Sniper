name: Genre-DB aktualisieren

on:
  schedule:
    - cron: "0 6 * * *"   # täglich 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write          # damit der Job genres-db.json committen darf

concurrency:
  group: genres
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Genre-DB bauen/aktualisieren
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: node collector.mjs

      - name: genres-db.json committen (falls geändert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genres-db.json
          git diff --staged --quiet || git commit -m "Genre-DB aktualisiert [skip ci]"
          git push
