name: Genre-DB aktualisieren

on:
  schedule:
    - cron: "0 * * * *"   # stündlich (sinnvoller Maximaltakt; Job dauert ~5 Min)
  workflow_dispatch: {}

permissions:
  contents: write          # damit der Job genres-db.json committen darf

concurrency:
  group: genres
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Normale Läufe brauchen ~1 Minute. Ohne Grenze hing der Job einmal 15
    # Minuten und wurde dann ohne verwertbare Meldung abgebrochen. So scheitert
    # er schnell und mit klarer Ursache.
    timeout-minutes: 8
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      # setup-node ist nicht nötig: ubuntu-latest bringt Node bereits mit
      - name: Genre-DB bauen/aktualisieren
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: node collector.mjs

      - name: genres-db.json committen (falls geändert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add genres-db.json
          git diff --staged --quiet || git commit -m "Genre-DB aktualisiert [skip ci]"
          git push
