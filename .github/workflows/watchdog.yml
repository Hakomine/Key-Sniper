name: Wächter

on:
  schedule:
    - cron: "20 * * * *"   # stündlich, versetzt zum Genre-Job
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      # setup-node ist nicht nötig: ubuntu-latest bringt Node bereits mit
      - name: Läuft der Cron noch?
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node watchdog.mjs
